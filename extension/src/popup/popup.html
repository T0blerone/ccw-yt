<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ccw-yt</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <div class="popup__brand">
          <h1 class="popup__title">ccw-yt</h1>
          <span class="popup__pill" id="status-pill">Locked</span>
        </div>
        <button
          type="button"
          class="popup__icon-btn"
          id="open-options"
          title="Settings"
          aria-label="Settings"
        ></button>
      </header>

      <section class="popup__panel" id="active-panel" hidden>
        <div class="popup__timer" id="remaining-display">0:00</div>
        <p class="popup__caption">Remaining wall-clock budget</p>
        <button type="button" class="popup__button popup__button--danger" id="end-session">
          End Session Early
        </button>
      </section>

      <section class="popup__panel" id="cooldown-panel" hidden>
        <div class="popup__timer popup__timer--muted" id="cooldown-display">0:00</div>
        <p class="popup__caption">Post-session cooldown active</p>
      </section>

      <section class="popup__panel" id="locked-panel" hidden>
        <div class="popup__stepper">
          <button
            type="button"
            class="popup__step-btn"
            id="step-minus"
            aria-label="Decrease by 5 minutes"
          ></button>
          <span class="popup__minutes-wrap">
            <input
              type="text"
              inputmode="numeric"
              class="popup__minutes-input"
              id="minutes-input"
              value="20"
              aria-label="Session duration in minutes"
            />
            <span class="popup__minutes-unit">min</span>
          </span>
          <button
            type="button"
            class="popup__step-btn"
            id="step-plus"
            aria-label="Increase by 5 minutes"
          ></button>
        </div>
        <input
          type="range"
          class="popup__slider"
          id="minutes-slider"
          min="5"
          max="120"
          step="5"
          value="20"
          aria-label="Duration slider"
        />
        <button type="button" class="popup__button popup__button--primary" id="start-session">
          Start Session
        </button>
      </section>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
